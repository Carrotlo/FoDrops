# Installed when FoReforge is present. Unchanged defaults are removed while it is absent.
# Edited profiles are kept, and owner-deleted profiles are not restored automatically.
drops:
  foreforge_egyptian_cat:
    name: FoReforge - Egyptian Cat
    event: MOB_KILL
    cancel-vanilla-drops: false
    priority: 0
    stop-processing: false
    conditions:
      worlds: []
      disabled-worlds: []
      biomes: []
      targets: []
      required-plugins: [FoReforge]
      entity-pdc:
        'fodungeons:mob-profile': [egyptian_cat]
      permission: ''
      tools: []
      silk-touch: IGNORE
      fortune-min: 0
      cooldown-ms: 0
      weather: []
    custom-drops:
      cats-paw:
        item-reward: false
        send-message: false
        respect-fortune: false
        chance: 2.0
        min-amount: 1
        max-amount: 1
        delivery-mode: INVENTORY
        commands:
          give:
            sender: CONSOLE
            command: foreforgeadmin give {player} cats-paw
      tomblight:
        item-reward: false
        send-message: false
        respect-fortune: false
        chance: 1.2
        min-amount: 1
        max-amount: 1
