tokens:
  prefix: "{theme}FoDrops &8» {muted}"
  theme: "#03fc88"
  muted: "#a7b8b0"
  white: "#ffffff"
  good: "#3ecf8e"
  bad: "#ff5d73"

no-permission: "{prefix} {bad}You don't have permission."
players-only: "{prefix} {bad}Only players can run this command."
unknown-subcommand: "{prefix} {bad}Unknown subcommand: {theme}{arg}{bad}."

help-header: "{prefix} {muted}Available commands:"
help-version: "{prefix} {theme}/fodrops version {muted}- show plugin info"
help-editor: "{prefix} {theme}/fodrops editor {muted}- open drop editor GUI"
help-reload: "{prefix} {theme}/fodrops reload {muted}- reload config.yml, messages.yml, and drops.yml"
help-count: "{prefix} {muted}Configured drop profiles: {theme}{count}"

version: "{prefix} {muted}Author: {theme}Carrotio {muted}| Version: {theme}{version}"
reloaded: "{prefix} {good}Reloaded config.yml, messages.yml, and drops.yml. Loaded {theme}{count} {good}drop profiles."
reload-failed: "{prefix} {bad}Reload failed at {theme}{step}{bad}. {muted}{error}"
native-dialogs-fallback: "{prefix} {muted}Native dialogs are not supported on this server; using chat input mode."
editor-saved: "{prefix} {good}Saved {theme}{setting}{good}."
editor-save-failed: "{prefix} {bad}Could not save {theme}{setting}{bad}. {muted}{error}"

drop-created: "{prefix} {good}Created drop profile {theme}{id}{good}."
drop-limit-reached: "{prefix} {bad}Drop profile limit reached ({theme}{max}{bad})."
drop-deleted: "{prefix} {bad}Deleted drop profile {theme}{id}{bad}."
drop-missing: "{prefix} {bad}That drop profile no longer exists."
drop-renamed: "{prefix} {good}Renamed drop to {theme}{name}{good}."
drop-event-updated: "{prefix} {good}Event type set to {theme}{event}{good}."
drop-priority-updated: "{prefix} {good}Priority set to {theme}{priority}{good}."
drop-cancel-updated: "{prefix} {muted}Cancel vanilla drops: {state}{muted}."
drop-stop-updated: "{prefix} {muted}Stop processing: {state}{muted}."

custom-drop-added: "{prefix} {good}Added a custom drop entry."
custom-command-added: "{prefix} {good}Added a command reward."
custom-drop-limit-reached: "{prefix} {bad}Custom drop limit reached ({theme}{max}{bad})."
custom-drop-removed: "{prefix} {bad}Removed custom drop entry."
custom-drop-missing: "{prefix} {bad}That custom drop entry no longer exists."
custom-drop-item-updated: "{prefix} {good}Updated custom drop item."
custom-drop-chance-updated: "{prefix} {good}Chance updated to {theme}{chance}%{good}."
custom-drop-amount-updated: "{prefix} {good}Amount range set to {theme}{min}-{max}{good}."
custom-drop-delivery-updated: "{prefix} {good}Delivery mode set to {mode}{good}."
custom-drop-message-updated: "{prefix} {muted}Reward message: {state}{muted}."
custom-drop-type-updated: "{prefix} {muted}Item reward: {state}{muted}."
custom-drop-fortune-updated: "{prefix} {muted}Respect fortune: {state}{muted}."
custom-drop-command-required: "{prefix} {bad}Add at least one command before disabling the item reward."
custom-drop-message: "{prefix} {good}You received {theme}{amount}x {item}{good} from {theme}{profile}{good}."

condition-updated: "{prefix} {good}Updated condition: {theme}{condition}{good}."

command-added: "{prefix} {good}Added command action."
command-limit-reached: "{prefix} {bad}Command action limit reached ({theme}{max}{bad})."
command-updated: "{prefix} {good}Updated command text."
command-removed: "{prefix} {bad}Removed command action."
command-sender-updated: "{prefix} {good}Command sender set to {theme}{sender}{good}."
command-missing: "{prefix} {bad}That command no longer exists."

cursor-required: "{prefix} {bad}Hold an item on your cursor first."
held-item-required: "{prefix} {bad}Hold an item in your main hand first."

prompt-rename: "{prefix} {muted}Type the new name in chat. Type {theme}cancel {muted}to abort."
prompt-add-drop: "{prefix} {muted}Type the initial drop profile name. Type {theme}cancel {muted}to abort."
prompt-priority: "{prefix} {muted}Type priority as an integer. Type {theme}cancel {muted}to abort."
prompt-targets: "{prefix} {muted}Type target keys separated by commas (example: {theme}stone{muted}), or {theme}none{muted}. Use {theme}cancel{muted} to abort."
prompt-mob-search: "{prefix} {muted}Type a mob search term, or {theme}none{muted} to clear. Use {theme}cancel{muted} to abort."
prompt-world-search: "{prefix} {muted}Type a world search term, or {theme}none{muted} to clear. Use {theme}cancel{muted} to abort."
prompt-chance: "{prefix} {muted}Type chance {theme}(0-100){muted}. Use {theme}cancel {muted}to abort."
prompt-amount: "{prefix} {muted}Type amount {theme}(single or min-max, max {max}){muted}. Use {theme}cancel {muted}to abort."
prompt-worlds: "{prefix} {muted}Type worlds separated by commas, or {theme}none{muted}. Use {theme}cancel{muted} to abort."
prompt-biomes: "{prefix} {muted}Type biome names separated by commas, or {theme}none{muted}. Use {theme}cancel{muted} to abort."
prompt-permission: "{prefix} {muted}Type permission node, or {theme}none{muted}. Use {theme}cancel{muted} to abort."
prompt-tools: "{prefix} {muted}Type tools (materials or tag:pickaxe) comma-separated, or {theme}none{muted}. Use {theme}cancel{muted} to abort."
prompt-fortune: "{prefix} {muted}Type minimum fortune level (0+). Use {theme}cancel{muted} to abort."
prompt-time: "{prefix} {muted}Type time range {theme}min-max{muted} (0-23999) or {theme}none{muted}. Use {theme}cancel{muted} to abort."
prompt-weather: "{prefix} {muted}Type weather list {theme}clear,rain,thunder{muted} or {theme}none{muted}. Use {theme}cancel{muted} to abort."
prompt-cooldown: "{prefix} {muted}Type cooldown in milliseconds (0 = disabled). Use {theme}cancel{muted} to abort."
prompt-command-add: "{prefix} {muted}Type {theme}<console|player> <command>{muted}. Use {theme}cancel{muted} to abort."
prompt-command-drop-add: "{prefix} {muted}Type {theme}<console|player> <command>{muted} for the command reward. Use {theme}cancel{muted} to abort."
prompt-command-edit: "{prefix} {muted}Type the new command text. Use {theme}cancel{muted} to abort."
prompt-max-profiles: "{prefix} {muted}Type max profiles ({theme}{min}-{max}{muted}). Use {theme}cancel{muted} to abort."
prompt-max-custom-drops: "{prefix} {muted}Type max custom drops per profile ({theme}{min}-{max}{muted}). Use {theme}cancel{muted} to abort."
prompt-max-commands: "{prefix} {muted}Type max commands per entry ({theme}{min}-{max}{muted}). Use {theme}cancel{muted} to abort."
prompt-max-drop-amount: "{prefix} {muted}Type max drop amount ({theme}{min}-{max}{muted}). Use {theme}cancel{muted} to abort."
prompt-cancelled: "{prefix} {bad}Input cancelled."
prompt-invalid-text: "{prefix} {bad}Text cannot be empty."
prompt-invalid-number: "{prefix} {bad}That is not a valid number."
prompt-limit-format: "{prefix} {bad}Use a whole number from {theme}{min}{bad} to {theme}{max}{bad}."
prompt-chance-range: "{prefix} {bad}Chance must be between 0 and 100."
prompt-amount-format: "{prefix} {bad}Use a positive number or range like {theme}1-5{bad}, max {theme}{max}{bad}."
prompt-time-format: "{prefix} {bad}Use time range format {theme}1000-12000{bad}."
prompt-weather-format: "{prefix} {bad}Use clear/rain/thunder separated by commas, or {theme}none{bad}."
prompt-command-format: "{prefix} {bad}Use format: {theme}<console|player> <command>{bad}."
